buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle plugin
        classpath("com.android.tools.build:gradle:8.0.2")

        // React Native Gradle plugin
        classpath("com.facebook.react:react-native-gradle-plugin")

        // Kotlin Gradle plugin
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")

        // Firebase Google services Gradle plugin
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
// The line below was commented out in your original snippet. It's unnecessary and incorrect syntax to try and apply the plugin here.
// apply plugin: "com.google.gms.google-services:4.4.2" apply false

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
